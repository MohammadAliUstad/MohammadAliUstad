<svg xmlns="http://www.w3.org/2000/svg" width="934" height="166" viewBox="0 0 934 166" role="img" aria-label="6,500+ downloads across apps; 150+ ratings across apps; 0 ads in any app; 9 apps built from scratch">
  <style>
    @font-face { font-family: 'Outfit'; font-weight: 100 900; src: url(data:font/woff2;base64,) format('woff2'); }
    .num { font: 700 34px 'Outfit', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #FFF8E7; text-anchor: middle; }
    .lbl { font: 500 13.5px 'Outfit', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #9FB4CC; text-anchor: middle; }
    .adtxt { font: 800 11px 'Outfit', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #9CC0E8; letter-spacing: .5px; }



    /* Downloads: the arrow keeps dropping into the tray */
    .dl-arrow { animation: drop 1.8s ease-in-out infinite; }
    @keyframes drop { 0% { transform: translateY(-6px); opacity: 0; } 30% { opacity: 1; } 60% { transform: translateY(3px); opacity: 1; } 100% { transform: translateY(3px); opacity: 0; } }

    /* Rating: the star turns and twinkles */
    .star { transform-box: fill-box; transform-origin: center; animation: twirl 3.2s ease-in-out infinite; }
    @keyframes twirl { 0%, 70%, 100% { transform: rotate(0) scale(1); } 80% { transform: rotate(72deg) scale(1.2); } 90% { transform: rotate(72deg) scale(.95); } }
    .spark { opacity: 0; animation: spark 3.2s ease-in-out infinite; }
    .s2 { animation-delay: .25s; }
    @keyframes spark { 0%, 72%, 100% { opacity: 0; } 82% { opacity: 1; } }

    /* No ads: the strike keeps slashing through */
    .strike { stroke-dasharray: 60; animation: slash 2.6s ease-in-out infinite; }
    @keyframes slash { 0%, 15% { stroke-dashoffset: 60; } 35%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -60; } }

    /* Nine apps: tiles pop in one by one */
    .app { transform-box: fill-box; transform-origin: center; animation: app 3s cubic-bezier(.3,1.6,.5,1) infinite; }
    @keyframes app { 0% { transform: scale(0); } 12%, 80% { transform: scale(1); } 92%, 100% { transform: scale(0); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
<g transform="translate(0 12)">
  <g class="card">
    <rect x="2" y="2" width="222" height="150" rx="4" fill="#18304D" stroke="#F5C842" stroke-opacity=".22"/>
    <rect x="2" y="2" width="222" height="3" fill="#F5C842" fill-opacity=".85"/>
    <g class="dl">
      <path d="M99.0 50 v8 h28 v-8" fill="none" stroke="#9CC0E8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="dl-arrow"><path d="M113.0 28 v18 M106.0 40 l7 7 l7 -7" fill="none" stroke="#3DDC84" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    </g>
    <text class="num" x="113.0" y="104">6,500+</text>
    <text class="lbl" x="113.0" y="132">downloads across apps</text>
  </g>
  <g class="card">
    <rect x="238" y="2" width="222" height="150" rx="4" fill="#18304D" stroke="#F5C842" stroke-opacity=".22"/>
    <rect x="238" y="2" width="222" height="3" fill="#F5C842" fill-opacity=".85"/>
    <g class="star"><polygon points="349.0,29.0 352.8,38.7 363.3,39.4 355.2,46.0 357.8,56.1 349.0,50.5 340.2,56.1 342.8,46.0 334.7,39.4 345.2,38.7" fill="#F5C842"/></g>
    <g class="spark s1"><path d="M368.0 29 v8 M364.0 33 h8" stroke="#FFE7A3" stroke-width="2" stroke-linecap="round"/></g>
    <g class="spark s2"><path d="M329.0 50 v6 M326.0 53 h6" stroke="#FFE7A3" stroke-width="2" stroke-linecap="round"/></g>
    <text class="num" x="349.0" y="104">150+</text>
    <text class="lbl" x="349.0" y="132">ratings across apps</text>
  </g>
  <g class="card">
    <rect x="474" y="2" width="222" height="150" rx="4" fill="#18304D" stroke="#F5C842" stroke-opacity=".22"/>
    <rect x="474" y="2" width="222" height="3" fill="#F5C842" fill-opacity=".85"/>
    <rect x="568.0" y="33" width="34" height="22" rx="4" fill="none" stroke="#9CC0E8" stroke-width="3"/>
    <text x="585.0" y="49" text-anchor="middle" class="adtxt">ADS</text>
    <path class="strike" d="M564.0 58 L606.0 30" stroke="#FF4A3D" stroke-width="4" stroke-linecap="round"/>
    <text class="num" x="585.0" y="104">0</text>
    <text class="lbl" x="585.0" y="132">ads in any app</text>
  </g>
  <g class="card">
    <rect x="710" y="2" width="222" height="150" rx="4" fill="#18304D" stroke="#F5C842" stroke-opacity=".22"/>
    <rect x="710" y="2" width="222" height="3" fill="#F5C842" fill-opacity=".85"/>
    <rect class="app" style="animation-delay:0.00s" x="806.0" y="29" width="8" height="8" rx="2" fill="#7F52FF"/><rect class="app" style="animation-delay:0.12s" x="817.0" y="29" width="8" height="8" rx="2" fill="#3DDC84"/><rect class="app" style="animation-delay:0.24s" x="828.0" y="29" width="8" height="8" rx="2" fill="#4285F4"/><rect class="app" style="animation-delay:0.36s" x="806.0" y="40" width="8" height="8" rx="2" fill="#F5C842"/><rect class="app" style="animation-delay:0.48s" x="817.0" y="40" width="8" height="8" rx="2" fill="#FF7A2E"/><rect class="app" style="animation-delay:0.60s" x="828.0" y="40" width="8" height="8" rx="2" fill="#D97757"/><rect class="app" style="animation-delay:0.72s" x="806.0" y="51" width="8" height="8" rx="2" fill="#A58BE0"/><rect class="app" style="animation-delay:0.84s" x="817.0" y="51" width="8" height="8" rx="2" fill="#5AB4E6"/><rect class="app" style="animation-delay:0.96s" x="828.0" y="51" width="8" height="8" rx="2" fill="#F05032"/>
    <text class="num" x="821.0" y="104">9</text>
    <text class="lbl" x="821.0" y="132">apps built from scratch</text>
  </g>
</g>
</svg>
